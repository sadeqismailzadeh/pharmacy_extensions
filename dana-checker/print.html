<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <title>گزارش مبالغ قابل پرداخت - بیمه دانا</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      margin: 30px;
      color: #333;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #222;
      padding-bottom: 15px;
    }
    .formula-note {
      background-color: #fdfae3;
      border: 1px solid #e2d888;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 13px;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      direction: rtl; /* متن راهنما راست به چپ باشد */
    }
    .formula-container {
      display: inline-flex;
      direction: ltr; /* فرمول ریاضی به صورت استاندارد از چپ به راست چیده شود */
      align-items: center;
      gap: 5px;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }
    th, td {
      border: 1px solid #777;
      padding: 10px;
      text-align: right;
      font-size: 13px;
    }
    th {
      background-color: #e9eef4;
      font-weight: bold;
    }
    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    tbody tr:nth-child(odd) {
      background-color: #ffffff;
    }
    .highlight-col {
      font-weight: bold;
      color: #0056b3;
      background-color: #f0f7ff;
    }
    @media print {
      body { margin: 10px; }
      .no-print { display: none; }
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <header>
    <h2 id="reportTitle">گزارش لیست بیماران و مبالغ قابل پرداخت</h2>
    <div class="formula-note" id="formulaNote">
      <!-- فرمول به صورت پویا توسط جاوااسکریپت درج می‌شود -->
    </div>
  </header>

  <table id="resultTable">
    <thead>
      <tr id="tableHeaderRow">
        <!-- ستون‌ها به صورت پویا ساخته می‌شوند -->
      </tr>
    </thead>
    <tbody>
      <!-- اطلاعات در اینجا لود می شوند -->
    </tbody>
  </table>

  <script src="print.js"></script>
</body>
</html>
